env:
  dynamic: false
  # FIXED: Room geometry - rooms closer to center for easier learning
  # Room centers at: arena - room_radius - edge_margin = 8 - 2.0 - 0.4 = 5.6
  # Room inner edge at: 5.6 - 2.0 = 3.6 (just outside center_radius=3.0)
  # Distance from center edge to room edge: 3.6 - 3.0 = 0.6 (very close!)
  n_agents: 4            # Start with fewer agents
  n_rooms: 4             # Start with more rooms
  arena_radius: 8.0      # Smaller arena = rooms closer to center
  center_radius: 3.0     # Standard center
  max_steps: 200         # Shorter episodes for faster learning
  spinning_phase_range_start: 30
  spinning_phase_range_end: 60
  room_radius: 2.0       # Larger rooms = easier to enter
  room_capacity: 2
  phase_mode: both       # Enable spinning->claiming transitions
