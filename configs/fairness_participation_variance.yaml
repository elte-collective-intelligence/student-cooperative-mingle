fairness:
  mode: "participation_variance" # "none" | "gini" | "participation_variance" | "exclusion_counts"
  alpha: 0.5                     # 0-1: how strong the redistribution
  participation_threshold: 0.0   # reward > threshold -> participation
  exclusion_threshold: -0.1      # reward < threshold -> exclusion (not used in this mode)
