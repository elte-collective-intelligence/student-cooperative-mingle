# @package _global_
# Sweep config for Pareto frontier (small scenarios)
# Run with: python train_hydra.py --multirun +sweep=pareto

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      fairness.alpha: 0.0,0.25,0.5,0.75,1.0
      seed: 1,2,3,4,5
      env.n_agents: 4,6
      env.n_rooms: 2,3

defaults:
  - override /algorithm: mappo
  - override /communication: none
  - override /curriculum: none
  - override /fairness: pareto
