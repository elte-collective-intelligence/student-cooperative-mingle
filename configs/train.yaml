train:
  # Training configuration
  total_frames: 50000           # 50k frames as requested
  frames_per_batch: 2400        # Covers ~3 full episodes
  num_epochs: 10                # Gradient updates per batch
  minibatch_size: 400           # Stable gradient batch size
  max_grad_norm: 0.5            # Standard gradient clipping
  lr: 3.0e-4                    # Stable LR
  lr_step_size: 50              # LR decay interval
  lr_gamma: 0.9                 # LR decay factor
  log_interval: 5
  metrics_save_path: "training_metrics.json"
  eval_episodes: 10
  # Warmup period before LR decay
  lr_warmup_steps: 10
  curriculum:
    # [n_agents, n_rooms, frames] - Single stage at 50k
    - [4, 4, 50000]             # 4 agents, 4 rooms, 50k frames
